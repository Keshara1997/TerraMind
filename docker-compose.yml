
name: TerraMind-next

services:

# ==========================================
  # Backend
# ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: TerraMind-backend
    command: > 
       celery -A app.workers.celery_app:celery_app
       worker --loglevel=info --concurrency=2
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - terramind-datasets:/data/terra-mind/datasets

    ports:
      - "127.0.0.1:${API_PORT}:8000"
    
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - TerraMind-network

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_NAME: ${APP_NAME:-TerraMind Next}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}




# ==========================================
  # Frontend
# ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: TerraMind-frontend

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    depends_on:
      - backend

    networks:
      - TerraMind-network



  # ==========================================
  # PostgreSQL + PostGIS
  # ==========================================

  postgres:
    image: postgis/postgis:16-3.5
    container_name: TerraMind-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - TerraMind-network

  # ==========================================
  # Redis
  # ==========================================

  redis:
    image: redis:7-alpine
    container_name: TerraMind-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    networks:
      - TerraMind-network

# ==========================================
# Persistent Volumes
# ==========================================

volumes:
  postgres_data:
    name: TerraMind-postgres-data

  redis_data:
    name: TerraMind-redis-data

  frontend_node_modules:
    name: TerraMind-frontend-node-modules

  frontend_next:
    name: TerraMind-frontend-next

# ==========================================
# Internal Docker Network
# ==========================================

networks:
  TerraMind-network:
    name: TerraMind-network
    driver: bridge
