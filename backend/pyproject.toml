
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "TerraMind-next-backend"
version = "0.1.0"
description = "TerraMind Next geospatial platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "alembic>=1.13",
    "GeoAlchemy2>=0.15",
    "Shapely>=2.0",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT>=2.9",
    "celery[redis]>=5.4,<6.0",
    "httpx>=0.27,<1.0",
    "rasterio>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pyproj>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
