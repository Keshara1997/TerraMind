
name: TerraMind-next

services:

# ==========================================
  # Backend
# ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: TerraMind-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:${API_PORT}:8000"
    
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - TerraMind-network



  # ==========================================
  # PostgreSQL + PostGIS
  # ==========================================

  postgres:
    image: postgis/postgis:16-3.5
    container_name: TerraMind-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - TerraMind-network

  # ==========================================
  # Redis
  # ==========================================

  redis:
    image: redis:7-alpine
    container_name: TerraMind-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    networks:
      - TerraMind-network

# ==========================================
# Persistent Volumes
# ==========================================

volumes:
  postgres_data:
    name: TerraMind-postgres-data

  redis_data:
    name: TerraMind-redis-data

# ==========================================
# Internal Docker Network
# ==========================================

networks:
  TerraMind-network:
    name: TerraMind-network
    driver: bridge
